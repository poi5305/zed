syntax = "proto3";
package zed.messages;

// Claude Code session running on the remote machine.
message ClaudeSession {
  uint32 process_id = 1;
  string session_id = 2;
  string working_directory = 3;
  string version = 4;
  optional string name = 5;
  optional string status = 6;
  optional int64 updated_at = 7;
  optional string tmux_target = 8;
  optional string transcript_path = 9;
  // The context the session's newest answer was given. Zero when its transcript holds no
  // answer yet.
  uint64 context_tokens = 10;
  // Claude Code's own total for the session, when it has written one.
  optional double total_cost_usd = 11;
  // The id of the session on claude.ai, when the registry recorded one.
  optional string bridge_session_id = 12;
}

// Request to list Claude Code sessions on the remote host.
message ListClaudeSessions {
  uint64 project_id = 1;
  optional string project_root = 2;
}

// Response containing the list of Claude Code sessions on the remote host.
message ListClaudeSessionsResponse {
  repeated ClaudeSession sessions = 1;
  // Home directory of the machine that produced the paths in this response, which is
  // the machine the sessions run on rather than the one Zed runs on. Every path the
  // client checks against a boundary under the home directory has to be checked
  // against this one.
  string home_directory = 2;
  optional string liveness_unavailable_reason = 3;
}

// One subagent conversation of a session, as the machine it runs on describes it.
message ClaudeSubagent {
  string agent_id = 1;
  optional string workflow_run_id = 2;
  string agent_type = 3;
  optional string description = 4;
  optional string tool_use_id = 5;
  uint32 spawn_depth = 6;
  optional string model = 7;
  optional string workflow_phase = 8;
  optional string transcript_path = 9;
  uint64 size = 10;
  // What the run's journal.jsonl says about this agent. Absent for an agent that belongs
  // to no workflow run, and for one whose run has written no journal the scan could read.
  // The session's own conversation cannot answer this: the Workflow call is answered when
  // the run launches, not when it ends.
  optional bool workflow_agent_finished = 11;
  // Whether the Task call that spawned this agent has been answered in the session's own
  // conversation, which is the only record of such an agent having returned. Absent for
  // an agent that records no tool_use_id, and for one whose conversation could not be
  // read.
  optional bool task_agent_finished = 12;
  // The requestShape the agent sidecar recorded, which says whether its Task call is
  // answered when it launches or when it returns. Absent on most agents.
  optional string request_shape = 13;
}

message ListClaudeSubagents {
  uint64 project_id = 1;
  string session_id = 2;
}

message ListClaudeSubagentsResponse {
  repeated ClaudeSubagent subagents = 1;
}

// One request for every listed session's agents, so the host walks
// ~/.claude/projects once rather than once per session.
message ListClaudeSubagentsForSessions {
  uint64 project_id = 1;
  repeated string session_ids = 2;
}

message ClaudeSubagentsOfSession {
  string session_id = 1;
  repeated ClaudeSubagent subagents = 2;
}

message ListClaudeSubagentsForSessionsResponse {
  repeated ClaudeSubagentsOfSession by_session = 1;
}

// One row of `claude agents --json`.
message ClaudeAgent {
  optional string id = 1;
  string kind = 2;
  optional string state = 3;
  optional string status = 4;
  optional string waiting_for = 5;
  optional uint32 pid = 6;
  optional string session_id = 7;
  optional string name = 8;
  optional string cwd = 9;
  optional string started_at = 10;
}

message ListClaudeAgents {
  uint64 project_id = 1;
}

message ListClaudeAgentsResponse {
  repeated ClaudeAgent agents = 1;
}

// Continue an ended session in the background: `claude --bg --resume <session_id>`.
message ResumeClaudeSession {
  uint64 project_id = 1;
  string session_id = 2;
  string cwd = 3;
}

message ResumeClaudeSessionResponse {
  string output = 1;
}

// `claude respawn <id>` or `claude stop <id>` on the machine the session lived on.
message RunClaudeAgentCommand {
  uint64 project_id = 1;
  repeated string args = 2;
  string cwd = 3;
}

message RunClaudeAgentCommandResponse {
  string output = 1;
}

// One slash command a session answers to.
message ClaudeSlashCommand {
  // Without the leading slash, as the reader types it.
  string name = 1;
  optional string description = 2;
  optional string argument_hint = 3;
  // 0 built into the CLI, 1 the project's own, 2 the user's own. Anything else is read
  // as built in, which is the scope that says the least about where it came from.
  uint32 scope = 4;
}

// Request the slash commands a session in this project answers to. The CLI writes its
// own commands down nowhere, so the machine lists what it holds and the caller adds the
// built-in ones.
message ListClaudeSlashCommands {
  uint64 project_id = 1;
  optional string project_root = 2;
  // When set, `project_root` must be that session's working directory or inside it.
  optional string session_id = 3;
}

message ListClaudeSlashCommandsResponse {
  repeated ClaudeSlashCommand commands = 1;
}

enum ClaudeHookInstallOutcome {
  AlreadyCurrent = 0;
  ScriptsRefreshed = 1;
  Installed = 2;
}

// Request to incrementally read ~/.claude/zed-events/<session_id>.jsonl.
message TailClaudeEvents {
  uint64 project_id = 1;
  string session_id = 2;
  uint64 offset = 3;
  bytes pending = 4;
}

message TailClaudeEventsResponse {
  optional string path = 1;
  uint64 start_offset = 2;
  uint64 offset = 3;
  bytes pending = 4;
  repeated string lines = 5;
  bool restarted = 6;
}

// Request the raw statusLine JSON for a session.
message ReadClaudeStatus {
  uint64 project_id = 1;
  string session_id = 2;
}

message ReadClaudeStatusResponse {
  optional string status_json = 1;
}

message InstallClaudeHooks {
  uint64 project_id = 1;
}

message InstallClaudeHooksResponse {
  ClaudeHookInstallOutcome outcome = 1;
  optional string backup_path = 2;
}

message UninstallClaudeHooks {
  uint64 project_id = 1;
}

message UninstallClaudeHooksResponse {}

message ClaudeHooksInstalled {
  uint64 project_id = 1;
}

message ClaudeHooksInstalledResponse {
  bool installed = 1;
}

// Request to incrementally read the transcript of a Claude Code session.
message TailClaudeTranscript {
  uint64 project_id = 1;
  string session_id = 2;
  optional string path = 3;
  uint64 offset = 4;
  bytes pending = 5;
  // When agent_id is set, the tail targets that subagent's conversation instead of
  // the main conversation. When both agent_id and workflow_run_id are present,
  // the tail targets the subagent conversation of that workflow run.
  optional string agent_id = 6;
  optional string workflow_run_id = 7;
}

// Incremental transcript updates and progress state for a Claude Code session.
message TailClaudeTranscriptResponse {
  optional string path = 1;
  uint64 start_offset = 2;
  uint64 offset = 3;
  bytes pending = 4;
  repeated string lines = 5;
  bool restarted = 6;
}

// Request to read the head of an offloaded tool output file, or of a file a session
// delivered to the user with `SendUserFile`.
message ReadClaudeFile {
  uint64 project_id = 1;
  string path = 2;
  uint64 max_bytes = 3;
  // Set only for an attachment, and it is what the far end judges the path against: the
  // file sits wherever the session wrote it rather than under `~/.claude/projects`, so
  // the boundary is that session's own working directory. Absent for an offloaded tool
  // output, which is judged against `~/.claude/projects` as before.
  optional string session_id = 4;
}

// Response containing file contents up to max_bytes and whether it was truncated.
message ReadClaudeFileResponse {
  bytes contents = 1;
  bool truncated = 2;
}

// Whether the Zed channel server is live for a Claude Code process.
message ClaudeChannelStatus {
  uint64 project_id = 1;
  uint32 claude_pid = 2;
}

message ClaudeChannelStatusResponse {
  bool live = 1;
  optional int64 heartbeat_at_ms = 2;
  optional uint32 server_pid = 3;
  repeated string features = 4;
}

// Write a message to the session's channel outbox.
message ClaudeChannelSend {
  uint64 project_id = 1;
  uint32 claude_pid = 2;
  string content = 3;
}

message ClaudeChannelSendResponse {
  string outbox_file = 1;
}

// Answer a permission prompt through the channel outbox.
message ClaudeChannelAnswerPermission {
  uint64 project_id = 1;
  uint32 claude_pid = 2;
  string request_id = 3;
  bool allow = 4;
}

message ClaudeChannelAnswerPermissionResponse {
  string outbox_file = 1;
}

// Incrementally read ~/.claude/zed-channel/<claude_pid>/inbox.jsonl.
message TailClaudeChannelInbox {
  uint64 project_id = 1;
  uint32 claude_pid = 2;
  uint64 offset = 3;
  bytes pending = 4;
}

message TailClaudeChannelInboxResponse {
  optional string path = 1;
  uint64 start_offset = 2;
  uint64 offset = 3;
  bytes pending = 4;
  repeated string lines = 5;
  bool restarted = 6;
}

// Write an interrupt to the session's channel outbox.
message ClaudeChannelInterrupt {
  uint64 project_id = 1;
  uint32 claude_pid = 2;
  string reason = 3;
}

message ClaudeChannelInterruptResponse {
  string outbox_file = 1;
}

// Request the paths under a session's working directory that a partly typed `@` names.
message ListClaudeSessionFiles {
  uint64 project_id = 1;
  // Optional sub-path under the session's working directory. Empty means that directory.
  string directory = 2;
  string query = 3;
  string session_id = 4;
}

message ListClaudeSessionFilesResponse {
  repeated string paths = 1;
}

// Request that a file pasted into the message box be written where the session can read
// it. The host decides where; only the name is taken from here, and only its last
// component.
message WriteClaudeSessionFile {
  uint64 project_id = 1;
  string name = 2;
  bytes contents = 3;
}

message WriteClaudeSessionFileResponse {
  string path = 1;
}
