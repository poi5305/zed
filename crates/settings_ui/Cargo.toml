[package]
name = "settings_ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/settings_ui.rs"

[features]
default = []
test-support = []

[dependencies]
agent.workspace = true
agent_settings.workspace = true
agent_skills.workspace = true
anyhow.workspace = true
client.workspace = true
cloud_api_types.workspace = true
component.workspace = true
collections.workspace = true
context_server.workspace = true
copilot.workspace = true
copilot_ui.workspace = true
cpal.workspace = true
editor.workspace = true
extension.workspace = true
fs.workspace = true
feature_flags.workspace = true
futures.workspace = true
fuzzy.workspace = true
gpui.workspace = true
heck.workspace = true
http_client.workspace = true
http_proxy.workspace = true
itertools.workspace = true
language.workspace = true
language_model.workspace = true
log.workspace = true
menu.workspace = true
paths.workspace = true
picker.workspace = true
regex.workspace = true
platform_title_bar.workspace = true
project.workspace = true
release_channel.workspace = true
rodio.workspace = true
schemars.workspace = true
search.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
settings.workspace = true
shell_command_parser.workspace = true
strum.workspace = true
telemetry.workspace = true
theme.workspace = true
theme_settings.workspace = true
ui.workspace = true
url.workspace = true
ui_input.workspace = true
util.workspace = true
workspace.workspace = true
zed_actions.workspace = true
zed_credentials_provider.workspace = true

# Measured for wasm32 rather than assumed: these three build, so their settings
# pages stay in the browser. Phase 3a gated all five together, before
# `edit_prediction` was ported and before the WASI SDK existed.
codestral.workspace = true
edit_prediction.workspace = true
edit_prediction_ui.workspace = true

# `audio` needs livekit and `extension_host` needs wasmtime -- the one package
# docs/web-zed-plan.md §4 keeps out of the wasm graph on purpose. These two are
# native-only for real, and the pages that use them are cfg'd out to match.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
audio.workspace = true
extension_host.workspace = true

[dev-dependencies]
fs = { workspace = true, features = ["test-support"] }
futures.workspace = true
gpui = { workspace = true, features = ["test-support"] }
language_models = { workspace = true, features = ["test-support"] }
paths.workspace = true
pretty_assertions.workspace = true
project = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
settings = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }

[package.metadata.cargo-shear]
ignored = ["component"]
