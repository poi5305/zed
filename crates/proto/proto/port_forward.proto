syntax = "proto3";
package zed.messages;

// Byte tunnels used to forward a local TCP port to the remote host over the
// existing remote RPC channel, so that forwarding works on every platform and
// transport rather than only where `ssh -O forward` is available.

message OpenPortTunnel {
  uint64 project_id = 1;
  uint64 tunnel_id = 2;
  string remote_host = 3;
  uint32 remote_port = 4;
}

message PortTunnelData {
  uint64 project_id = 1;
  uint64 tunnel_id = 2;
  bytes data = 3;
}

// Sent once the bytes have actually been written to the socket, which is what
// gives the sender back its credit.
message PortTunnelAck {
  uint64 project_id = 1;
  uint64 tunnel_id = 2;
  uint64 bytes_consumed = 3;
}

// An empty `error` means the sender's socket reached EOF, which half-closes the
// tunnel. A non-empty `error` tears the whole tunnel down.
message ClosePortTunnel {
  uint64 project_id = 1;
  uint64 tunnel_id = 2;
  string error = 3;
}

// Detection of the ports that are listening on the remote host, so that a new
// server started there can be offered for forwarding.
// `connection_id` is the value this client sets as `ZED_REMOTE_CONNECTION_ID`
// in its terminals. With it, a port is the project's only when it descends from
// one of those terminals or from a Claude session inside a worktree. An older
// client leaves it unset and gets the working-directory rule it was built for.
message GetListeningPorts {
  uint64 project_id = 1;
  optional string connection_id = 2;
}

message GetListeningPortsResponse {
  repeated ListeningPort ports = 1;
}

// A server that attributes ports sets `in_project` on every one; an older
// server leaves it unset, which is how a client tells the two apart.
message ListeningPort {
  string host = 1;
  uint32 port = 2;
  optional uint32 pid = 3;
  optional string process_name = 4;
  optional bool in_project = 5;
  optional string claude_session_id = 6;
  optional string claude_session_name = 7;
  // Set when the port is not worth a notification even if it is the
  // project's: the operating system picked it, or a browser holds it. Unset
  // from an older server, which means offer it.
  optional bool not_worth_offering = 8;
}
