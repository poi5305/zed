[package]
name = "settings_json"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/settings_json.rs"

[features]
default = ["editing"]
editing = ["dep:tree-sitter", "dep:tree-sitter-json"]

[dependencies]
anyhow.workspace = true
util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
serde_path_to_error.workspace = true

# No longer native-only. tree-sitter's C compiles and links for wasm32 against its own
# vendored libc headers (docs/web-zed-plan.md §4.4), so the real structural-edit
# implementation runs in the browser instead of the panicking stubs it used to get.
# The `wasm` feature here is tree-sitter's own and does not pull wasmtime in this fork,
# which is §4's decision (b).
tree-sitter = { workspace = true, features = ["wasm"], optional = true }
tree-sitter-json = { workspace = true, optional = true }

[dev-dependencies]
unindent.workspace = true
pretty_assertions.workspace = true
